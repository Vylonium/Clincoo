<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace · Clincoo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{min-height:100vh;margin:0;padding:0;font-family:'Inter',sans-serif;background:#f7f7f8;color:#111;-webkit-font-smoothing:antialiased}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#ddd;border-radius:99px}
        .font-montserrat{font-family:'Montserrat',sans-serif}
        .fade-in{animation:fadeIn .25s ease forwards}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

        #sidebar{transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
        #sidebar.open{transform:translateX(0)}
        #sb-backdrop{opacity:0;pointer-events:none;transition:opacity .25s ease}
        #sb-backdrop.open{opacity:1;pointer-events:all}

        .proj-card{transition:box-shadow .18s,transform .18s}
        .proj-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.09);transform:translateY(-2px)}

        .tag-pill{background:#efefef;color:#555;font-size:.68rem;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}

        .badge{font-size:.7rem;font-weight:600;padding:2px 10px;border-radius:99px}
        .badge-Aktif{background:#dcfce7;color:#166534}
        .badge-Selesai{background:#dbeafe;color:#1d4ed8}
        .badge-Hold{background:#fef9c3;color:#854d0e}
        .badge-Arsip{background:#f3f4f6;color:#6b7280}

        .prog-bar{background:#e9e9ef;border-radius:99px;height:5px;overflow:hidden}
        .prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .4s ease}

        #modal-ov{opacity:0;pointer-events:none;transition:opacity .2s}
        #modal-ov.open{opacity:1;pointer-events:all}
        #modal-box{transform:scale(.95) translateY(14px);transition:transform .22s,opacity .22s;opacity:0}
        #modal-ov.open #modal-box{transform:scale(1) translateY(0);opacity:1}

        #toast{transform:translateY(80px);opacity:0;transition:all .28s ease;pointer-events:none}
        #toast.show{transform:translateY(0);opacity:1}

        input:focus,textarea:focus,select:focus{outline:2px solid #6366f1;outline-offset:1px;border-color:#6366f1}

        .pulse-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

        .tab-btn{border-bottom:2px solid transparent;transition:border-color .15s,color .15s;padding-bottom:6px;font-size:.83rem;font-weight:500;color:#9ca3af;cursor:pointer;white-space:nowrap}
        .tab-btn.active{border-bottom-color:#6366f1;color:#111}

        .act-line{position:relative;padding-left:24px}
        .act-line::before{content:'';position:absolute;left:9px;top:24px;bottom:-6px;width:1px;background:#e5e7eb}
        .act-line:last-child::before{display:none}
        .act-dot{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;z-index:1}
        .hide-sb::-webkit-scrollbar{display:none}
        .hide-sb{-ms-overflow-style:none;scrollbar-width:none}
    </style>
</head>
<body>

<!-- SIDEBAR BACKDROP -->
<div id="sb-backdrop" class="fixed inset-0 bg-black/40 z-40" onclick="closeSB()"></div>

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed top-0 left-0 h-full w-68 bg-white z-50 flex flex-col shadow-2xl" style="width:270px">
    <div class="px-5 py-4 flex items-center justify-between border-b border-gray-100">
        <span class="font-montserrat font-black text-xl tracking-tight">Clincoo</span>
        <button onclick="closeSB()" class="p-1.5 rounded-xl hover:bg-gray-100 text-gray-500 transition"><i class="ph ph-x text-lg"></i></button>
    </div>
    <nav class="flex-1 overflow-y-auto py-3 px-3 space-y-0.5">
        <button onclick="setView('proyek');closeSB()" id="nav-proyek" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-black transition">
            <i class="ph ph-folder-open text-lg"></i> Proyek
        </button>
        <button onclick="setView('tugas');closeSB()" id="nav-tugas" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-black transition">
            <i class="ph ph-check-square text-lg"></i> Tugas
        </button>
        <button onclick="setView('aktivitas');closeSB()" id="nav-aktivitas" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-black transition">
            <i class="ph ph-activity text-lg"></i> Aktivitas
        </button>
    </nav>
    <div class="p-4 border-t border-gray-100">
        <a href="index.html" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-2xl bg-black text-white text-sm font-semibold hover:bg-gray-800 transition">
            <i class="ph ph-chat-circle text-base"></i> Obrolan Baru
        </a>
    </div>
</aside>

<!-- HEADER -->
<header class="fixed top-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <button onclick="openSB()" class="p-2 rounded-xl hover:bg-gray-100 text-gray-600 transition"><i class="ph ph-list text-xl"></i></button>
            <div class="flex items-center gap-2">
                <span class="font-montserrat font-black text-lg tracking-tight">Workspace</span>
                <div class="hidden sm:flex items-center gap-1.5 text-xs text-gray-400 bg-gray-50 px-2.5 py-1 rounded-full">
                    <span class="pulse-dot"></span>
                    <span id="live-time">--:--:--</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="index.html" class="hidden sm:flex items-center gap-1.5 text-sm text-gray-500 hover:text-black transition px-3 py-2 rounded-xl hover:bg-gray-100">
                <i class="ph ph-chat-circle text-base"></i> Obrolan
            </a>
            <button onclick="openModal()" class="flex items-center gap-1.5 bg-black text-white text-xs font-semibold px-3.5 py-2 rounded-xl hover:bg-gray-800 transition">
                <i class="ph ph-plus text-sm"></i> Proyek
            </button>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="pt-14 pb-24 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6">

    <!-- VIEW: PROYEK -->
    <div id="view-proyek" class="view-sec">

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <p class="text-xs text-gray-400 font-medium mb-0.5">Total</p>
                <p id="st-total" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <p class="text-xs text-gray-400 font-medium mb-0.5">Aktif</p>
                <p id="st-aktif" class="text-2xl font-bold text-indigo-600">0</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <p class="text-xs text-gray-400 font-medium mb-0.5">Selesai</p>
                <p id="st-selesai" class="text-2xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <p class="text-xs text-gray-400 font-medium mb-0.5">✓ Tugas</p>
                <p id="st-tasks" class="text-2xl font-bold text-green-600">0</p>
            </div>
        </div>

        <!-- Search + filter -->
        <div class="flex gap-2 mb-5">
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input id="srch" type="text" placeholder="Cari proyek..." oninput="renderProjects()"
                    class="w-full bg-white border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-sm shadow-sm">
            </div>
            <select id="flt" onchange="renderProjects()" class="bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm shadow-sm text-gray-600">
                <option value="">Semua</option>
                <option>Aktif</option><option>Selesai</option><option>Hold</option><option>Arsip</option>
            </select>
        </div>

        <!-- Grid -->
        <div id="proj-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="proj-empty" class="hidden flex-col items-center justify-center py-24 text-center">
            <div class="w-20 h-20 rounded-3xl bg-gray-100 flex items-center justify-center mb-4">
                <i class="ph ph-folder-open text-4xl text-gray-300"></i>
            </div>
            <p class="text-gray-500 font-medium mb-1">Belum ada proyek</p>
            <p class="text-gray-400 text-sm">Buat proyek baru atau minta AI di Obrolan</p>
        </div>
    </div>

    <!-- VIEW: DETAIL -->
    <div id="view-detail" class="view-sec hidden"></div>

    <!-- VIEW: TUGAS -->
    <div id="view-tugas" class="view-sec hidden">
        <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-bold">Semua Tugas</h2>
        </div>
        <div id="all-tasks" class="space-y-4"></div>
        <div id="tasks-empty" class="hidden text-center py-20">
            <i class="ph ph-check-square text-4xl text-gray-200 mb-3 block"></i>
            <p class="text-gray-400 text-sm">Belum ada tugas di semua proyek.</p>
        </div>
    </div>

    <!-- VIEW: AKTIVITAS -->
    <div id="view-aktivitas" class="view-sec hidden">
        <h2 class="text-xl font-bold mb-5">Feed Aktivitas</h2>
        <div id="act-feed" class="space-y-1"></div>
    </div>

</div>
</main>

<!-- MODAL -->
<div id="modal-ov" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 px-4">
    <div id="modal-box" class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between">
            <h3 id="modal-title" class="font-bold text-lg">Proyek Baru</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-gray-100 text-gray-500"><i class="ph ph-x"></i></button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 block">Nama Proyek *</label>
                <input id="m-name" type="text" placeholder="Nama proyek..." class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 block">Deskripsi</label>
                <textarea id="m-desc" rows="2" placeholder="Deskripsi singkat..." class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm resize-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 block">Status</label>
                    <select id="m-status" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm">
                        <option>Aktif</option><option>Hold</option><option>Selesai</option><option>Arsip</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 block">Deadline</label>
                    <input id="m-deadline" type="date" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm">
                </div>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 block">Tags (pisah koma)</label>
                <input id="m-tags" type="text" placeholder="web, desain, api..." class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
            </div>
        </div>
        <button onclick="saveProject()" class="w-full bg-black text-white font-semibold py-3 rounded-2xl hover:bg-gray-800 transition text-sm">
            Simpan Proyek
        </button>
        <p id="modal-err" class="text-red-500 text-xs text-center hidden">Nama proyek tidak boleh kosong.</p>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white text-sm font-medium px-5 py-2.5 rounded-2xl shadow-2xl"></div>

<script>
const WS_KEY  = 'clincoo_projects';
const ACT_KEY = 'clincoo_global_activity_v2';
let projects = [];
let editId = null;
let curView = 'proyek';

// ── STORAGE ──────────────────────────────────────
function load(){ projects = JSON.parse(localStorage.getItem(WS_KEY)) || []; }
function save(){ localStorage.setItem(WS_KEY, JSON.stringify(projects)); notifySync(); }
function notifySync(){
    try{ new BroadcastChannel('clincoo_sync').postMessage('project_update'); }catch(e){}
}
function pushAct(msg, icon='ph-lightning'){
    const a = JSON.parse(localStorage.getItem(ACT_KEY)) || [];
    a.unshift({id:uid(), message:msg, icon, ts:Date.now()});
    if(a.length>200) a.pop();
    localStorage.setItem(ACT_KEY, JSON.stringify(a));
}

// ── UTILS ─────────────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function timeAgo(ts){
    const s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'baru saja';
    if(s<3600) return Math.floor(s/60)+' mnt lalu';
    if(s<86400) return Math.floor(s/3600)+' jam lalu';
    return Math.floor(s/86400)+' hari lalu';
}
function fmtDate(ts){
    if(!ts) return '—';
    return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
}
function toast(msg){
    const el=document.getElementById('toast');
    el.textContent=msg; el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),2200);
}
function badge(s){
    return `<span class="badge badge-${s||'Aktif'}">${s||'Aktif'}</span>`;
}

// ── SIDEBAR ───────────────────────────────────────
function openSB(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sb-backdrop').classList.add('open'); }
function closeSB(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sb-backdrop').classList.remove('open'); }

// ── VIEW ──────────────────────────────────────────
function setView(v){
    curView = v;
    document.querySelectorAll('.view-sec').forEach(el=>el.classList.add('hidden'));
    document.getElementById('view-'+v)?.classList.remove('hidden');
    document.querySelectorAll('.nav-btn').forEach(b=>{
        b.classList.toggle('bg-gray-100',b.id==='nav-'+v);
        b.classList.toggle('text-black',b.id==='nav-'+v);
    });
    load();
    if(v==='proyek') renderProjects();
    if(v==='tugas') renderAllTasks();
    if(v==='aktivitas') renderActivity();
}

// ── MODAL ─────────────────────────────────────────
function openModal(id=null){
    editId=id;
    document.getElementById('modal-err').classList.add('hidden');
    if(id){
        const p=projects.find(x=>x.id===id);
        if(!p) return;
        document.getElementById('modal-title').textContent='Edit Proyek';
        document.getElementById('m-name').value=p.name;
        document.getElementById('m-desc').value=p.desc||'';
        document.getElementById('m-status').value=p.status||'Aktif';
        document.getElementById('m-deadline').value=p.deadline||'';
        document.getElementById('m-tags').value=(p.tags||[]).join(', ');
    } else {
        document.getElementById('modal-title').textContent='Proyek Baru';
        ['m-name','m-desc','m-deadline','m-tags'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('m-status').value='Aktif';
    }
    document.getElementById('modal-ov').classList.add('open');
    setTimeout(()=>document.getElementById('m-name').focus(),180);
}
function closeModal(){ document.getElementById('modal-ov').classList.remove('open'); editId=null; }
function saveProject(){
    const name=document.getElementById('m-name').value.trim();
    if(!name){ document.getElementById('modal-err').classList.remove('hidden'); return; }
    load();
    const data={name, desc:document.getElementById('m-desc').value.trim(),
        status:document.getElementById('m-status').value,
        deadline:document.getElementById('m-deadline').value||null,
        tags:document.getElementById('m-tags').value.split(',').map(t=>t.trim()).filter(Boolean)};
    if(editId){
        const i=projects.findIndex(x=>x.id===editId);
        if(i>-1) Object.assign(projects[i],data,{updatedAt:Date.now()});
        pushAct(`Proyek "${name}" diperbarui`,'ph-pencil');
        toast('Proyek diperbarui ✓');
    } else {
        projects.unshift({id:uid(),...data,tasks:[],notes:[],activities:[],createdAt:Date.now(),updatedAt:Date.now()});
        pushAct(`Proyek "${name}" dibuat`,'ph-folder-plus');
        toast('Proyek dibuat ✓');
    }
    save(); closeModal(); renderProjects(); updateStats();
}

// ── PROJECT GRID ──────────────────────────────────
function renderProjects(){
    load();
    const q=(document.getElementById('srch')?.value||'').toLowerCase();
    const fs=document.getElementById('flt')?.value||'';
    let list=projects.filter(p=>{
        const mq=!q||p.name.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q);
        const ms=!fs||p.status===fs;
        return mq&&ms;
    });
    const grid=document.getElementById('proj-grid');
    const empty=document.getElementById('proj-empty');
    if(!list.length){
        grid.innerHTML='';
        empty.classList.remove('hidden'); empty.classList.add('flex');
        updateStats(); return;
    }
    empty.classList.add('hidden'); empty.classList.remove('flex');
    grid.innerHTML=list.map(p=>{
        const total=(p.tasks||[]).length;
        const done=(p.tasks||[]).filter(t=>t.done).length;
        const pct=total?Math.round(done/total*100):0;
        const tags=(p.tags||[]).slice(0,3).map(t=>`<span class="tag-pill">${t}</span>`).join('');
        const dl=p.deadline?`<span class="text-[10px] text-gray-400 flex items-center gap-0.5"><i class="ph ph-calendar"></i>${fmtDate(new Date(p.deadline).getTime())}</span>`:'';
        return `<div class="proj-card bg-white rounded-2xl p-5 shadow-sm border border-gray-100 cursor-pointer fade-in" onclick="openDetail('${p.id}')">
            <div class="flex items-start justify-between gap-2 mb-2">
                <h3 class="font-semibold text-sm leading-snug text-gray-900 line-clamp-2 flex-1">${p.name}</h3>
                ${badge(p.status)}
            </div>
            ${p.desc?`<p class="text-xs text-gray-400 mb-3 line-clamp-2">${p.desc}</p>`:''}
            ${total?`<div class="mb-3">
                <div class="flex justify-between text-[10px] text-gray-400 mb-1"><span>${done}/${total} tugas</span><span>${pct}%</span></div>
                <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
            </div>`:''}
            <div class="flex items-center justify-between flex-wrap gap-1.5 pt-2 border-t border-gray-50">
                <div class="flex gap-1 flex-wrap">${tags}</div>
                ${dl}
            </div>
            <p class="text-[10px] text-gray-300 mt-2">${timeAgo(p.updatedAt||p.createdAt)}</p>
        </div>`;
    }).join('');
    updateStats();
}

// ── STATS ─────────────────────────────────────────
function updateStats(){
    document.getElementById('st-total').textContent=projects.length;
    document.getElementById('st-aktif').textContent=projects.filter(p=>p.status==='Aktif').length;
    document.getElementById('st-selesai').textContent=projects.filter(p=>p.status==='Selesai').length;
    document.getElementById('st-tasks').textContent=projects.reduce((s,p)=>s+(p.tasks||[]).filter(t=>t.done).length,0);
}

// ── DETAIL ────────────────────────────────────────
function openDetail(id){
    load();
    const p=projects.find(x=>x.id===id);
    if(!p) return;
    const total=(p.tasks||[]).length, done=(p.tasks||[]).filter(t=>t.done).length;
    const pct=total?Math.round(done/total*100):0;
    document.getElementById('view-proyek').classList.add('hidden');
    const dv=document.getElementById('view-detail');
    dv.classList.remove('hidden');
    dv.innerHTML=`<div class="fade-in">
        <button onclick="backToProjek()" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-black mb-5 transition">
            <i class="ph ph-arrow-left"></i> Semua Proyek
        </button>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
            <div class="flex items-start gap-2 flex-wrap">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap mb-1">
                        <h2 class="font-bold text-lg leading-tight">${p.name}</h2>
                        ${badge(p.status)}
                    </div>
                    ${p.desc?`<p class="text-sm text-gray-500 mb-2">${p.desc}</p>`:''}
                    ${(p.tags||[]).length?`<div class="flex gap-1 flex-wrap mb-2">${p.tags.map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div>`:''}
                    <div class="flex flex-wrap gap-3 text-xs text-gray-400">
                        <span><i class="ph ph-calendar mr-0.5"></i>${p.deadline?fmtDate(new Date(p.deadline).getTime()):'Tidak ada deadline'}</span>
                        <span><i class="ph ph-clock mr-0.5"></i>${fmtDate(p.createdAt)}</span>
                    </div>
                </div>
                <div class="flex gap-1.5">
                    <button onclick="openModal('${p.id}')" class="p-2 rounded-xl hover:bg-gray-100 text-gray-500 transition"><i class="ph ph-pencil text-lg"></i></button>
                    <button onclick="delProject('${p.id}')" class="p-2 rounded-xl hover:bg-red-50 text-gray-300 hover:text-red-500 transition"><i class="ph ph-trash text-lg"></i></button>
                </div>
            </div>
            ${total?`<div class="mt-4 pt-4 border-t border-gray-50">
                <div class="flex justify-between text-xs text-gray-400 mb-1.5"><span>${done}/${total} tugas selesai</span><span>${pct}%</span></div>
                <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
            </div>`:''}
        </div>
        <div class="flex gap-5 border-b border-gray-100 mb-5 overflow-x-auto hide-sb">
            <button class="tab-btn active" data-t="tasks" onclick="switchTab('tasks','${p.id}',this)">Tugas</button>
            <button class="tab-btn" data-t="notes" onclick="switchTab('notes','${p.id}',this)">Catatan</button>
            <button class="tab-btn" data-t="acts" onclick="switchTab('acts','${p.id}',this)">Aktivitas</button>
        </div>
        <div id="tab-tasks">
            <div class="flex gap-2 mb-4">
                <input id="ntask" type="text" placeholder="Tambah tugas..." onkeydown="if(event.key==='Enter')addTask('${p.id}')"
                    class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                <button onclick="addTask('${p.id}')" class="px-4 py-2.5 bg-black text-white rounded-xl text-sm font-medium hover:bg-gray-800 transition">+</button>
            </div>
            <div id="task-list">${tasksHTML(p)}</div>
        </div>
        <div id="tab-notes" class="hidden">
            <textarea id="note-txt" rows="8" placeholder="Catatan proyek..." class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm resize-none mb-3">${(p.notes||[]).join('\n')}</textarea>
            <button onclick="saveNotes('${p.id}')" class="px-5 py-2.5 bg-black text-white rounded-xl text-sm font-medium hover:bg-gray-800 transition">Simpan</button>
        </div>
        <div id="tab-acts" class="hidden">
            ${(p.activities||[]).length?
                (p.activities||[]).slice(0,30).map(a=>`
                <div class="act-line pb-4 mb-1">
                    <div class="act-dot"><i class="ph ${a.icon||'ph-lightning'} text-indigo-500 text-xs"></i></div>
                    <p class="text-sm text-gray-700">${a.message}</p>
                    <p class="text-xs text-gray-400">${timeAgo(a.ts)}</p>
                </div>`).join('')
                :'<p class="text-sm text-gray-400">Belum ada aktivitas.</p>'}
        </div>
    </div>`;
}

function tasksHTML(p){
    const tasks=p.tasks||[];
    if(!tasks.length) return '<p class="text-sm text-gray-400 text-center py-8">Belum ada tugas. Tambah di atas.</p>';
    return tasks.map(t=>`
        <div class="flex items-center gap-3 bg-white border border-gray-100 rounded-xl px-4 py-3 mb-2 group">
            <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${p.id}','${t.id}',this.checked)"
                class="w-4 h-4 accent-indigo-600 cursor-pointer flex-shrink-0">
            <span class="text-sm flex-1 ${t.done?'line-through text-gray-300':'text-gray-800'}">${t.text}</span>
            <button onclick="delTask('${p.id}','${t.id}')" class="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 transition p-1 rounded-lg">
                <i class="ph ph-x text-sm"></i></button>
        </div>`).join('');
}

function switchTab(tab,pid,btn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['tab-tasks','tab-notes','tab-acts'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
    document.getElementById('tab-'+tab)?.classList.remove('hidden');
}

function backToProjek(){
    document.getElementById('view-detail').classList.add('hidden');
    document.getElementById('view-proyek').classList.remove('hidden');
    renderProjects();
}

// ── TASKS ─────────────────────────────────────────
function addTask(pid){
    const inp=document.getElementById('ntask');
    const text=inp.value.trim(); if(!text) return;
    load();
    const p=projects.find(x=>x.id===pid); if(!p) return;
    if(!p.tasks) p.tasks=[];
    const task={id:uid(),text,done:false,createdAt:Date.now()};
    p.tasks.push(task);
    p.updatedAt=Date.now();
    if(!p.activities) p.activities=[];
    p.activities.unshift({id:uid(),message:`Tugas ditambahkan: "${text}"`,icon:'ph-check-square',ts:Date.now()});
    pushAct(`Tugas "${text}" di "${p.name}"`,'ph-check-square');
    save(); inp.value='';
    document.getElementById('task-list').innerHTML=tasksHTML(p);
    updateStats(); toast('Tugas ditambahkan ✓');
}
function toggleTask(pid,tid,done){
    load();
    const p=projects.find(x=>x.id===pid); if(!p) return;
    const t=(p.tasks||[]).find(x=>x.id===tid); if(!t) return;
    t.done=done; p.updatedAt=Date.now();
    if(!p.activities) p.activities=[];
    p.activities.unshift({id:uid(),message:`Tugas "${t.text}" ${done?'selesai':'dibuka kembali'}`,icon:done?'ph-check':'ph-x',ts:Date.now()});
    save();
    document.getElementById('task-list').innerHTML=tasksHTML(p);
    updateStats();
}
function delTask(pid,tid){
    load();
    const p=projects.find(x=>x.id===pid); if(!p) return;
    p.tasks=(p.tasks||[]).filter(x=>x.id!==tid);
    p.updatedAt=Date.now(); save();
    document.getElementById('task-list').innerHTML=tasksHTML(p);
    updateStats(); toast('Tugas dihapus');
}
function saveNotes(pid){
    load();
    const p=projects.find(x=>x.id===pid); if(!p) return;
    p.notes=document.getElementById('note-txt').value.split('\n').filter(Boolean);
    p.updatedAt=Date.now(); save(); toast('Catatan disimpan ✓');
}
function delProject(id){
    if(!confirm('Hapus proyek ini?')) return;
    load();
    const p=projects.find(x=>x.id===id);
    pushAct(`Proyek "${p?.name}" dihapus`,'ph-trash');
    projects=projects.filter(x=>x.id!==id);
    save(); backToProjek(); toast('Proyek dihapus');
}

// ── ALL TASKS ─────────────────────────────────────
function renderAllTasks(){
    load();
    const el=document.getElementById('all-tasks');
    const empty=document.getElementById('tasks-empty');
    let html='', any=false;
    projects.forEach(p=>{
        if(!(p.tasks||[]).length) return;
        any=true;
        html+=`<div class="mb-4">
            <div class="flex items-center gap-2 mb-2">
                <span class="font-semibold text-sm">${p.name}</span>${badge(p.status)}
            </div>
            <div class="space-y-1.5">${(p.tasks||[]).map(t=>`
                <div class="flex items-center gap-3 bg-white border border-gray-100 rounded-xl px-4 py-2.5">
                    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${p.id}','${t.id}',this.checked);renderAllTasks()" class="w-4 h-4 accent-indigo-600 cursor-pointer">
                    <span class="text-sm ${t.done?'line-through text-gray-300':'text-gray-700'}">${t.text}</span>
                </div>`).join('')}
            </div>
        </div>`;
    });
    if(!any){ el.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden'); el.innerHTML=html;
}

// ── ACTIVITY ──────────────────────────────────────
function renderActivity(){
    const acts=JSON.parse(localStorage.getItem(ACT_KEY))||[];
    const el=document.getElementById('act-feed');
    if(!acts.length){ el.innerHTML='<p class="text-sm text-gray-400 text-center py-16">Belum ada aktivitas.</p>'; return; }
    el.innerHTML=acts.slice(0,60).map(a=>`
        <div class="act-line pb-4 fade-in">
            <div class="act-dot"><i class="ph ${a.icon||'ph-lightning'} text-indigo-500 text-xs"></i></div>
            <p class="text-sm text-gray-700">${a.message}</p>
            <p class="text-xs text-gray-400">${timeAgo(a.ts)}</p>
        </div>`).join('');
}

// ── CLOCK ─────────────────────────────────────────
function startClock(){
    const tick=()=>{
        const n=new Date();
        document.getElementById('live-time').textContent=
            [n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
    };
    tick(); setInterval(tick,1000);
}

// ── REALTIME SYNC ─────────────────────────────────
function startSync(){
    // Polling 3 detik untuk tangkap update dari index.html
    setInterval(()=>{
        const fresh=JSON.parse(localStorage.getItem(WS_KEY))||[];
        if(JSON.stringify(fresh)!==JSON.stringify(projects)){
            projects=fresh;
            if(curView==='proyek') renderProjects();
            if(curView==='tugas') renderAllTasks();
            if(curView==='aktivitas') renderActivity();
        }
    },3000);

    // storage event: update langsung saat tab lain tulis
    window.addEventListener('storage',e=>{
        if(e.key===WS_KEY){
            load();
            if(curView==='proyek') renderProjects();
            if(curView==='tugas') renderAllTasks();
            if(curView==='aktivitas') renderActivity();
        }
    });

    // BroadcastChannel (same-origin, same tab)
    try{
        const bc=new BroadcastChannel('clincoo_sync');
        bc.onmessage=()=>{
            load();
            if(curView==='proyek') renderProjects();
        };
    }catch(e){}
}

// ── INIT ──────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
    load(); renderProjects(); startClock(); startSync();
    document.getElementById('modal-ov').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
    document.getElementById('nav-proyek').classList.add('bg-gray-100','text-black');
});
</script>
</body>
